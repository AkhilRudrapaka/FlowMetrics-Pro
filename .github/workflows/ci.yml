name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The integration tests (tenant isolation, RBAC, auth rotation...) run against a real MongoDB.
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Test (race detector on)
        run: go test ./... -race -count=1 -cover

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker stack (build, start, smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the example environment
        run: cp .env.example .env
      - name: Build and start the full stack (waits until every service is healthy)
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Smoke test through nginx (UI, login, seeded data, tenant isolation)
        run: |
          set -euo pipefail
          B=http://localhost:3000
          curl -fsS "$B/" | grep -q 'id="root"'
          login() { curl -fsS -X POST "$B/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"password\":\"Password123!\"}" | jq -r .data.access_token; }
          alice=$(login alice@acme.test); dave=$(login dave@globex.test)
          test -n "$alice" && test "$alice" != null
          orgs=$(curl -fsS "$B/api/v1/orgs" -H "Authorization: Bearer $alice")
          echo "$orgs" | jq -e '.data | length == 2'
          acme=$(echo "$orgs" | jq -r '.data[] | select(.name=="Acme Corp") | .id')
          curl -fsS "$B/api/v1/orgs/$acme/dashboard" -H "Authorization: Bearer $alice" | jq -e '.data.total_projects == 3'
          # a different tenant must get 404, never data
          code=$(curl -s -o /dev/null -w '%{http_code}' "$B/api/v1/orgs/$acme/dashboard" -H "Authorization: Bearer $dave")
          test "$code" = 404
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
