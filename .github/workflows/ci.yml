name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      # The integration tests (tenant isolation, RBAC, auth rotation...) run against a real MongoDB.
      # Started in a step rather than as a `services:` container so the readiness check is plain bash.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              echo "MongoDB is ready"; exit 0
            fi
            sleep 2
          done
          docker logs mongo
          echo "MongoDB did not become ready" >&2
          exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Test (race detector on)
        run: go test ./... -race -count=1 -cover

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker stack (build, start, smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the example environment
        run: cp .env.example .env
      - name: Build and start the full stack (waits until every service is healthy)
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Smoke test through nginx (UI, login, seeded data, tenant isolation)
        run: node scripts/smoke.mjs http://localhost:3000
      - name: Build the single-image Render Dockerfile (API + UI) so it cannot rot unnoticed
        run: docker build -t flowmetrics-render .
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
