server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. The CSP is strict because the access token lives in page memory:
  # no inline scripts, no third-party origins. (style-src allows inline styles for progress-bar widths.)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # The API is reverse-proxied so the browser sees a single origin. That is what lets the
  # SameSite=Strict refresh cookie work with no CORS configuration at all.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  # Hashed filenames never change, so they can be cached forever. (`expires` rather than
  # `add_header`, because add_header in a location would drop the security headers above.)
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html so client-side routes survive a refresh.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
